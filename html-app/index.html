<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#dc2626" />
  <meta http-equiv="refresh" content="1;url=https://turis-2027.onrender.com/" />
  <title>Turis Tv — Açılıyor</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#09090b;color:#f4f4f5;font-family:Arial,Helvetica,sans-serif}.card{width:100%;max-width:440px;padding:30px;border:1px solid #27272a;border-radius:24px;background:#18181b;text-align:center}.logo{width:58px;height:58px;display:grid;place-items:center;margin:0 auto;border-radius:16px;background:linear-gradient(135deg,#dc2626,#be123c);font-weight:800;font-size:22px}h1{margin:18px 0 8px}p{color:#a1a1aa;line-height:1.6}.spinner{width:30px;height:30px;margin:22px auto;border:3px solid #3f3f46;border-top-color:#ef4444;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{display:block;padding:14px 18px;border-radius:13px;background:#dc2626;color:#fff;text-decoration:none;font-weight:700}a:hover{background:#ef4444}.note{font-size:12px;color:#71717a;margin-top:18px}
  </style>
  <script>
    // De echte, actuele Next.js-app staat op Render. Deze statische pagina is
    // alleen een doorverwijzer zodat er geen tweede/oude look meer bestaat.
    window.addEventListener("load",()=>{window.location.replace("https://turis-2027.onrender.com/")});
  </script>
</head>
<body>
  <main class="card">
    <div class="logo">TV</div>
    <h1>Turis Tv</h1>
    <p>Yeni görünüm ve canlı oynatıcı açılıyor…</p>
    <div class="spinner" aria-hidden="true"></div>
    <a href="https://turis-2027.onrender.com/">Turis Tv’yi hemen aç</a>
    <p class="note">Canlı sürüm: turis-2027.onrender.com</p>
  </main>
</body>
</html>
